name: CD Staging

on:
  workflow_dispatch:
  push:
    tags:
      - "staging-*"

jobs:
  deploy-staging:
    runs-on: ubuntu-latest
    environment: staging
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/smartbiz-backend:${{ github.sha }}

      - name: Build and push frontend image
        uses: docker/build-push-action@v6
        with:
          context: frontend
          file: frontend/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/smartbiz-frontend:${{ github.sha }}

      - name: Helm deploy staging
        run: |
          echo "Configure kubectl context using environment secrets and run helm upgrade --install"
          echo "helm upgrade --install smartbiz infrastructure/kubernetes/helm/smartbiz --set images.backend=ghcr.io/${{ github.repository_owner }}/smartbiz-backend:${{ github.sha }} --set images.frontend=ghcr.io/${{ github.repository_owner }}/smartbiz-frontend:${{ github.sha }}"
