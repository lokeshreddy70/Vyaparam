name: Load Test

on:
  workflow_dispatch:

jobs:
  stress:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check load test target
        id: target
        env:
          STRESS_BASE_URL: ${{ secrets.STRESS_BASE_URL }}
        run: |
          if [ -z "${STRESS_BASE_URL:-}" ]; then
            echo "has_target=false" >> "$GITHUB_OUTPUT"
            echo "STRESS_BASE_URL secret is not configured. Skipping load test execution."
          else
            echo "has_target=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Run load test suite
        if: steps.target.outputs.has_target == 'true'
        run: bash scripts/ops/load-test.sh
        env:
          STRESS_BASE_URL: ${{ secrets.STRESS_BASE_URL }}

      - name: Report skipped load tests
        if: steps.target.outputs.has_target != 'true'
        run: echo "Load-test workflow completed without stress run because STRESS_BASE_URL is not set."
