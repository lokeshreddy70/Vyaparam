version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: smartbiz-postgres-dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: vyaparam_db
      POSTGRES_USER: vyaparam
      POSTGRES_PASSWORD: vyaparam
    ports:
      - "5432:5432"
    volumes:
      - pgdata_dev:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: smartbiz-redis-dev
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "6379:6379"
    volumes:
      - redisdata_dev:/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile.dev
    container_name: smartbiz-backend-dev
    restart: unless-stopped
    env_file:
      - ./backend/.env.example
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://vyaparam:vyaparam@postgres:5432/vyaparam_db?schema=public
      REDIS_URL: redis://redis:6379
      CORS_ALLOWED_ORIGINS: http://localhost:5173
    ports:
      - "3000:3000"
    depends_on:
      - postgres
      - redis
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    container_name: smartbiz-frontend-dev
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: http://localhost:3000
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules

volumes:
  pgdata_dev:
  redisdata_dev:
