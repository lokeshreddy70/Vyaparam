version: "3.9"

services:
  postgres:
    image: postgres:16-alpine
    container_name: smartbiz-postgres
    restart: always
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vyaparam_db}
      POSTGRES_USER: ${POSTGRES_USER:-vyaparam}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change_me}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-vyaparam} -d ${POSTGRES_DB:-vyaparam_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - pgdata:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    container_name: smartbiz-redis
    restart: always
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "allkeys-lru"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redisdata:/data

  backend:
    image: ${BACKEND_IMAGE:-ghcr.io/smartbiz/backend:latest}
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: smartbiz-backend
    restart: always
    env_file:
      - ./backend/.env.example
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-vyaparam}:${POSTGRES_PASSWORD:-change_me}@postgres:5432/${POSTGRES_DB:-vyaparam_db}?schema=public
      REDIS_URL: redis://redis:6379
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-*}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "3000:3000"

  frontend:
    image: ${FRONTEND_IMAGE:-ghcr.io/smartbiz/frontend:latest}
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: smartbiz-frontend
    restart: always
    depends_on:
      - backend
    ports:
      - "80:80"

volumes:
  pgdata:
  redisdata:
