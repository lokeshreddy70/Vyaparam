apiVersion: v1
kind: ConfigMap
metadata:
  name: smartbiz-backend-config
  namespace: smartbiz
data:
  NODE_ENV: production
  PORT: "3000"
  CORS_ALLOWED_ORIGINS: "*"
  REQUEST_SIZE_LIMIT: "1mb"
  SLOW_QUERY_THRESHOLD_MS: "500"
  REDIS_URL: redis://smartbiz-redis:6379
  DATABASE_URL: postgresql://vyaparam:change_me@smartbiz-postgres:5432/vyaparam_db?schema=public
