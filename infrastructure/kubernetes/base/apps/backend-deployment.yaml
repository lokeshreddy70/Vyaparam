apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartbiz-backend
  namespace: smartbiz
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: smartbiz-backend
  template:
    metadata:
      labels:
        app: smartbiz-backend
    spec:
      containers:
        - name: backend
          image: ghcr.io/smartbiz/backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          envFrom:
            - configMapRef:
                name: smartbiz-backend-config
            - secretRef:
                name: smartbiz-backend-secret
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            requests:
              cpu: 200m
              memory: 256Mi
            limits:
              cpu: 1000m
              memory: 1Gi
