apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smartbiz-ingress
  namespace: smartbiz
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "10m"
    nginx.ingress.kubernetes.io/ssl-redirect: "true"
spec:
  ingressClassName: nginx
  rules:
    - host: smartbiz.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: smartbiz-backend
                port:
                  number: 3000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: smartbiz-frontend
                port:
                  number: 80
  tls:
    - hosts:
        - smartbiz.example.com
      secretName: smartbiz-tls
