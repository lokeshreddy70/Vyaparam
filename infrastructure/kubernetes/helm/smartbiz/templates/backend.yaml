apiVersion: v1
kind: ConfigMap
metadata:
  name: smartbiz-backend-config
  namespace: {{ .Values.namespace }}
data:
  NODE_ENV: {{ .Values.env.NODE_ENV | quote }}
  PORT: {{ .Values.env.PORT | quote }}
  CORS_ALLOWED_ORIGINS: {{ .Values.env.CORS_ALLOWED_ORIGINS | quote }}
  REQUEST_SIZE_LIMIT: {{ .Values.env.REQUEST_SIZE_LIMIT | quote }}
  SLOW_QUERY_THRESHOLD_MS: {{ .Values.env.SLOW_QUERY_THRESHOLD_MS | quote }}
  DATABASE_URL: {{ .Values.env.DATABASE_URL | quote }}
  REDIS_URL: {{ .Values.env.REDIS_URL | quote }}
---
apiVersion: v1
kind: Secret
metadata:
  name: smartbiz-backend-secret
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  JWT_ACCESS_SECRET: {{ .Values.secrets.JWT_ACCESS_SECRET | quote }}
  JWT_REFRESH_SECRET: {{ .Values.secrets.JWT_REFRESH_SECRET | quote }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: smartbiz-backend
  namespace: {{ .Values.namespace }}
spec:
  replicas: {{ .Values.backend.replicas }}
  selector:
    matchLabels:
      app: smartbiz-backend
  template:
    metadata:
      labels:
        app: smartbiz-backend
    spec:
      containers:
        - name: backend
          image: {{ .Values.images.backend }}
          ports:
            - containerPort: {{ .Values.backend.servicePort }}
          envFrom:
            - configMapRef:
                name: smartbiz-backend-config
            - secretRef:
                name: smartbiz-backend-secret
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.backend.servicePort }}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /api/v1/health
              port: {{ .Values.backend.servicePort }}
            initialDelaySeconds: 20
            periodSeconds: 15
          resources:
{{ toYaml .Values.backend.resources | indent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: smartbiz-backend
  namespace: {{ .Values.namespace }}
spec:
  selector:
    app: smartbiz-backend
  ports:
    - name: http
      port: {{ .Values.backend.servicePort }}
      targetPort: {{ .Values.backend.servicePort }}
