apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: smartbiz-backend-hpa
  namespace: {{ .Values.namespace }}
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: smartbiz-backend
  minReplicas: {{ .Values.backend.replicas }}
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
